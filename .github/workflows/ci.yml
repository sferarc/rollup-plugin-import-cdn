name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Public repository, so CI runs on GitHub-hosted runners: public repos get free
# minutes and the self-hosted pool is kept for private repos. Actions are pinned
# to full commit SHAs because the sferarc organisation requires it.

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node and pnpm come from mise.toml, checked against mise.lock.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # CI never commits, so the hooks never run here. This at least fails on a
      # lefthook.yml that lefthook would not load.
      - name: Hook config
        run: pnpm exec lefthook validate

      - name: Unused files, exports and dependencies
        run: pnpm knip

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Consumers rely on unused exports being dropped from their bundles.
      - name: Tree-shakable
        run: pnpm is-tree-shakable

  # A separate job so the required Check name stays as it is.
  min-node:
    name: Test (minimum Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # package.json engines.node is the single source for the minimum.
      - name: Minimum Node from engines
        run: echo "MISE_NODE_VERSION=$(jq -r '.engines.node' package.json | sed 's/^>=//')" >> "$GITHUB_ENV"

      # The action installs with --locked, which refuses a Node absent from mise.lock.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install: false

      - run: mise install

      - run: test "$(node --version)" = "v$MISE_NODE_VERSION"

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  # Runs the suite on the lowest Rollup the peer range accepts.
  rollup-3:
    name: Test (Rollup 3.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      # catalogMode is strict, so the catalog pin is rewritten and the lockfile regenerated.
      - name: Pin Rollup to the peer range floor
        run: |
          sed -i 's/^  rollup: .*/  rollup: 3.0.0/' pnpm-workspace.yaml

      - run: pnpm install --no-frozen-lockfile

      - run: test "$(pnpm exec rollup --version)" = "rollup v3.0.0"

      - name: Test
        run: pnpm test
