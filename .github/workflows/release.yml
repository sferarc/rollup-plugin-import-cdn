name: Release

# Changesets flow: pending changesets on main open a version PR, and merging
# that PR publishes. Nothing runs until the repository variable RELEASE_ENABLED
# is `true`, so the first release from this repository is the owner's decision.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing exchanges this OIDC token for a publish credential,
      # so no npm token is stored anywhere. Each package's trusted publisher on
      # npmjs.com must name this repository and release.yml.
      id-token: write
    steps:
      # An App token rather than github.token: a version PR merged by the Actions bot
      # pushes to main without triggering this workflow, so it would never publish.
      - name: Mint the sferarc-hq App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.HQ_APP_ID }}
          private-key: ${{ secrets.HQ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The npm bundled with the Node in mise.toml is the one that publishes, and
      # trusted publishing needs npm 11.5.1 or newer.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - run: pnpm install --frozen-lockfile

      - name: Create version PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          github-token: ${{ steps.app.outputs.token }}
