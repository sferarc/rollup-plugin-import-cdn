name: Live CDN

# Outside ci.yml so a CDN outage never blocks a pull request; a failed scheduled run files an issue.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live CDN
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5

      - run: pnpm install --frozen-lockfile

      - name: Test against the real CDNs
        run: pnpm test:live

      # Lanes only take ready issues opened by the sferarc-hq App, so github.token would file one nobody picks up.
      - name: Mint the sferarc-hq App token
        id: app
        if: failure() && github.event_name == 'schedule'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.HQ_APP_ID }}
          private-key: ${{ secrets.HQ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write

      - name: Report the failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live CDN check failed"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" \
              --label product:rollup-plugin-import-cdn --label bug --label p2 --label ready \
              --body "The weekly build through the real CDNs failed: $RUN_URL. Read the failing test in \`live/cdn.test.ts\`, recheck the CDN with \`curl\` and record what changed in \`brain/architecture/resolution.md\`."
          fi
